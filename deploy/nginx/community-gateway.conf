# =====================================================================
# 挂到「现有网关 nginx」上的 community 站点配置（第二阶段：HTTP + HTTPS）
#
# ⚠️⚠️ 装这个文件之前，证书必须已经签发并放到下面的 ssl_certificate 路径。
#
#    443 server 块引用了 /etc/nginx/ssl/community.aindgc.com.pem。
#    证书不存在时 `nginx -t` 报 cannot load certificate 并失败，
#    此时执行 docker restart 会让**整个网关容器起不来**，
#    同机的 www.aindgc.com 会一起挂掉。
#
#    正确顺序：
#      1. 先装 community-gateway-http.conf（只有 80 块，无证书依赖）
#      2. 用 certbot 通过 HTTP-01 签发 community 证书
#      3. 证书放到 ssl_certificate 指定的路径
#      4. 再把本文件换上，nginx -t 通过后重启
#
# 背景：同机的 aindgc 站点已经占用宿主机 80/443（它的 nginx 容器直绑）。
# 本项目不能再去抢这两个端口，否则 Docker 直接报 port is already allocated。
#
# 因此架构改为：
#
#   宿主机 80/443
#        │
#   ┌────▼─────────────────────────┐
#   │  aindgc 的 nginx 容器（网关）  │  ← 终止 TLS，按域名分流
#   └──┬──────────────┬───────────┘
#      │ www.aindgc   │ community.aindgc.com
#      │  (原样保留)   │
#      │              └──► nb-admin:80  ──► /api/ 反代到 nb-backend:8080
#      │                     （静态资源 + SPA）
#
# 生效方式（两选一）：
#   A) 把本文件放进网关容器的 conf.d 目录，docker restart 网关容器
#   B) 挂载进网关容器的 /etc/nginx/conf.d/，docker restart 网关容器
#
# 前提：nb-admin 必须已加入网关所在的 docker 网络（compose 里已配置
#       external network `gateway`），否则这里会报 host not found。
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name community.aindgc.com;

    # ⚠️ 与 community-gateway-http.conf 同理：
    #    变量形式的 proxy_pass 必须在运行时解析域名，漏了 resolver 会 502。
    #    127.0.0.11 是 Docker 内嵌 DNS，valid=10s 让换 IP 后自动跟上。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ACME 续期校验。签完证书后把这里改成 return 301 https://$host$request_uri;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 未配证书前先提供 HTTP 服务，避免 443 尚未就绪时完全不可达。
    set $nb_admin "http://nb-admin:80";

    location / {
        proxy_pass $nb_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name community.aindgc.com;

    # ⚠️ 路径取决于证书实际存放位置，按服务器实际情况调整
    ssl_certificate     /etc/nginx/ssl/community.aindgc.com.pem;
    ssl_certificate_key /etc/nginx/ssl/community.aindgc.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_COMMUNITY:10m;

    # 与 80 块同一个理由：变量形式 proxy_pass 必须配 resolver。
    # ⚠️ 443 块的 resolver 是独立的，80 块那个不会继承过来。
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # nb-admin 是同网络的独立容器，按容器名寻址。
    # 刻意用变量而非硬编码 IP：容器重启后 IP 会变。
    set $nb_admin "http://nb-admin:80";

    location / {
        proxy_pass $nb_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 二维码等二进制响应不要缓冲，避免截断
        proxy_buffering off;
    }
}