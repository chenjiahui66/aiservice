# =====================================================================
# 挂到「现有网关 nginx」上的 community 站点配置（HTTP + HTTPS）
#
# ── 当前模式：手动证书（云厂商免费证书）──────────────────────────
# 证书由你从阿里云/腾讯云等渠道下载后上传到：
#   宿主机：/opt/aindgc/deploy/docker/certs/conf/manual/community/
#   容器内：/etc/letsencrypt/manual/community/     ← 已挂载，无需改 compose
#
# ⚠️⚠️ 装这个文件之前，证书文件必须已经上传到位。
#    pem 路径不存在时 `nginx -t` 会报 cannot load certificate 并失败；
#    此时执行 docker restart 会让**整个网关容器起不来**，
#    同机的 www.aindgc.com 会一起挂掉。
#
# 🔄 手动证书的代价（重要）：
#    免费证书有效期 90 天，到期前**必须手动更换**并 reload，否则站点对外报证书错误。
#    换证书只要两步：
#      1. 覆盖 /opt/aindgc/deploy/docker/certs/conf/manual/community/ 下的两个文件
#      2. docker exec aindgc-web nginx -s reload
#
#    如果以后想改成 Let's Encrypt 自动续期：
#      certbot certonly --webroot -w /opt/aindgc/deploy/docker/certbot/www \
#        --cert-name community -d community.aindgc.com \
#        --config-dir /opt/aindgc/deploy/docker/certs/conf \
#        --work-dir /opt/aindgc/deploy/docker/certs/work \
#        --logs-dir /opt/aindgc/deploy/docker/certs/logs \
#        --agree-tos -m <邮箱> --non-interactive
#      然后把下面 ssl_certificate 两行的路径改成
#        /etc/letsencrypt/live/community/fullchain.pem
#        /etc/letsencrypt/live/community/privkey.pem
# =====================================================================

# ---------------------------------------------------------------- 80
# 与网关自己的 80 块分工：本块按 server_name 精确匹配 community，
# 优先于 default_server；负责放行 ACME 校验，其余跳转 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name community.aindgc.com;

    # ⚠️ 与 gateway-http 版同一个理由：
    #    变量形式 proxy_pass 在运行时才解析域名，漏了 resolver 会 502
    #    （no resolver defined to resolve nb-admin）。127.0.0.11 是 Docker
    #    内嵌 DNS，valid=10s 让容器换 IP 后自动跟上。
    #    （本块已不反代，保留以备后用）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ACME HTTP-01 校验。绝不能被下面的 301 拦掉，否则无法续期。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------- 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name community.aindgc.com;

    # ⚠️ 443 块的 resolver 是独立的，80 块那个不会继承过来。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 证书放在网关已挂载的 certs/conf 目录下，不需要给容器加挂载。
    # ⚠️ 用**带中间证书的完整链**那份（阿里云叫 xxx_bundle.pem / _ca_bundle.pem）。
    #    只有服务器证书、没有中间证书的话，部分浏览器和移动端会报「证书链不完整」。
    ssl_certificate     /etc/letsencrypt/manual/community/community.aindgc.com.pem;
    ssl_certificate_key /etc/letsencrypt/manual/community/community.aindgc.com.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL_COMMUNITY:10m;
    ssl_session_timeout       1d;
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # nb-admin 是同网络的独立容器，按容器名寻址。
    # 用变量而非硬编码 IP：容器重启后 IP 会变，写死必然 502。
    set $nb_admin "http://nb-admin:80";

    location / {
        proxy_pass $nb_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 二维码等二进制响应不要缓冲，避免响应体截断
        proxy_buffering off;
    }
}
