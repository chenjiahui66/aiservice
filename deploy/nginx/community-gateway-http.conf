# =====================================================================
# community.aindgc.com —— 网关配置（第一阶段：仅 HTTP，**可立即安装**）
#
# 用途：在证书还没签发之前先把站点挂上去，让 HTTP 可用，同时承接
#       certbot 的 ACME HTTP-01 校验。
#
# ⚠️ 为什么必须分两阶段（这不是洁癖，是防事故）：
#
#   完整版 community-gateway.conf 里的 443 server 块引用了
#   /etc/nginx/ssl/community.aindgc.com.pem。证书还没签发时这个文件不存在，
#   `nginx -t` 会直接报 cannot load certificate 并失败；
#   此时若执行 docker restart，**整个网关容器起不来**，
#   同机的 www.aindgc.com 会一起挂掉。
#
#   所以：证书就位前只装本文件（不含 443 块），
#        证书就位后再换成完整版 community-gateway.conf。
#
# 安装：
#   cp community-gateway-http.conf <网关 conf.d 挂载目录>/community.conf
#   docker exec <网关容器> nginx -t        # 必须通过才能重启
#   docker restart <网关容器>
#
# 连通性自检（报 bad address 'nb-admin' = 不在同一 docker 网络）：
#   docker exec <网关容器> wget -qO- http://nb-admin/v3/api-docs | head -c 200
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name community.aindgc.com;

    # ACME HTTP-01 签发/续期校验。签完证书后这段也可保留，不影响。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # nb-admin 是同网络的独立容器，按容器名寻址。
    # 刻意用变量而非硬编码 IP：容器重启后 IP 会变。
    set $nb_admin "http://nb-admin:80";

    location / {
        proxy_pass $nb_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 二维码等二进制响应不要缓冲，避免截断
        proxy_buffering off;
    }
}
