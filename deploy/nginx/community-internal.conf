# =====================================================================
# nb-admin 容器内部的 nginx（只服务本项目，不管 TLS）
#
# TLS 由外部网关（aindgc 的 nginx）终止后反代进来，
# 因为宿主机 80/443 已被同机 aindgc 站点占用，不能再抢。
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # ⚠️ 这一行不能省。
    #
    # 下面用 `set $nb_backend` + `proxy_pass $nb_backend` 而不是写死
    # `proxy_pass http://backend:8080`，是为了容器重启换 IP 后不用改配置。
    # 但 nginx 对**变量**形式的 proxy_pass 是在运行时才解析域名的，
    # 必须显式告诉它找谁问 DNS，否则每个转发都报：
    #     no resolver defined to resolve backend
    # 并返回 502 —— 表现为「后台打不开所有接口」。
    #
    # 127.0.0.11 是 Docker 内嵌 DNS。valid=10s 让容器换 IP 后 10 秒内自动跟上。
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API 反代到本项目后端 ----------
    # ⚠️⚠️ 这里必须写**容器名 nb-backend**，不能写服务名 backend。
    #
    #    本容器同时挂在两个 docker 网络上：
    #        nb-community_nb-net   （本项目：mysql / backend / admin）
    #        docker_aindgc         （同机 aindgc：web / backend / certbot）
    #
    #    两个网络里**都有一个叫 backend 的服务**。按服务名寻址时，
    #    Docker DNS 可能解析到 aindgc 的那个，请求就被送进了错误的应用 ——
    #    症状是本项目后端日志一片空白，接口却返回
    #        {"code":500,"message":"Internal error: NoResourceFoundException"}
    #    （那是 aindgc 的异常处理器吐的，不是本项目）。
    #
    #    容器名 nb-backend 是全局唯一的，不会有歧义。
    #    同理，网关侧用的是 nb-admin，aindgc 网络里没有同名服务，安全。
    set $nb_backend "http://nb-backend:8080";

    location /api/ {
        proxy_pass $nb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # 二维码是二进制且不大，关闭缓冲避免响应体截断
        proxy_buffering off;
    }

    # ---------- 接口文档 ----------
    location /doc.html {
        proxy_pass $nb_backend;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass $nb_backend;
        proxy_set_header Host $host;
    }

    # ---------- 前端静态资源 ----------
    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}