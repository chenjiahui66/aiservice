# =====================================================================
# nb-admin 容器内部的 nginx（只服务本项目，不管 TLS）
#
# TLS 由外部网关（aindgc 的 nginx）终止后反代进来，
# 因为宿主机 80/443 已被同机 aindgc 站点占用，不能再抢。
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- API 反代到本项目后端 ----------
    # 同在 nb-net 网络内，按容器名寻址。
    # 刻意用变量而非硬编码 IP：容器重启后 IP 会变，写死必然 502。
    set $nb_backend "http://backend:8080";

    location /api/ {
        proxy_pass $nb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # 二维码是二进制且不大，关闭缓冲避免响应体截断
        proxy_buffering off;
    }

    # ---------- 接口文档 ----------
    location /doc.html {
        proxy_pass $nb_backend;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass $nb_backend;
        proxy_set_header Host $host;
    }

    # ---------- 前端静态资源 ----------
    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}