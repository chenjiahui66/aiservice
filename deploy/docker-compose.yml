# ============================================================
# 邻里服务管家 —— 生产部署编排
#
# 使用：
#   cp deploy/.env.example deploy/.env   并填入真实值
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# ⚠️ 密钥只从 deploy/.env 注入，该文件已被 .gitignore 忽略，切勿提交。
# ============================================================
name: neighborhood

services:
  mysql:
    image: mysql:8.0
    container_name: nb-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必填}
      MYSQL_DATABASE: ${DB_NAME:-neighborhood}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?必填}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本；已初始化过的库会跳过
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - nb-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: neighborhood-backend:1.0.0
    container_name: nb-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-neighborhood}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:?必填}
      JWT_PROVIDER_SECRET: ${JWT_PROVIDER_SECRET:?必填}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?必填}
      WX_APP_ID: ${WX_APP_ID:?必填}
      WX_APP_SECRET: ${WX_APP_SECRET:?必填}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - qr-data:/data/qr
      - log-data:/data/logs
    networks:
      - nb-net
    deploy:
      resources:
        limits:
          memory: 768M

  admin-web:
    image: nginx:alpine
    container_name: nb-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      # admin-web 的构建产物目录
      - ../admin-web/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    networks:
      - nb-net

volumes:
  mysql-data:
  qr-data:
  log-data:

networks:
  nb-net:
    driver: bridge
