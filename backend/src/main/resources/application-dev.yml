# ============================================================
# 开发环境配置
# ⚠️ 本文件不含任何真实密钥。密码等敏感值一律走环境变量或 .env（已被 .gitignore 忽略）
# ============================================================
spring:
  # dev 环境自动加载 deploy/.env（key=value 格式，按 properties 解析）。
  # 目的：IDEA 直接运行 / mvn spring-boot:run 时也能读到凭据，不必先手工导出环境变量。
  # 两个候选路径分别覆盖工作目录为 backend\ 与仓库根的情况；optional: 缺失则静默跳过，
  # 回退到进程环境变量，不改变 docker-compose 的部署行为。
  config:
    import:
      - "optional:file:../deploy/.env[.properties]"
      - "optional:file:deploy/.env[.properties]"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ⚠️ characterEncoding 必须是大写 UTF-8：小写 utf8 在 Connector/J 里指向 utf8mb3，
#    与表的 utf8mb4 不匹配会导致中文双重编码（ä¸œé—¨…）。
#    详见 application-prod.yml 中的完整说明。
url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:neighborhood}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      pool-name: NeighborhoodHikari

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  # 开发期自动建管理员账号，密码取环境变量
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  storage:
    qr-dir: ${QR_DIR:./data/qr}

logging:
  level:
    com.neighborhood.service: DEBUG