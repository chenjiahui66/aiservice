# ============================================================
# 开发环境配置
# ⚠️ 本文件不含任何真实密钥。密码等敏感值一律走环境变量或 .env（已被 .gitignore 忽略）
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:neighborhood}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      pool-name: NeighborhoodHikari

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  # 开发期自动建管理员账号，密码取环境变量
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  storage:
    qr-dir: ${QR_DIR:./data/qr}

logging:
  level:
    com.neighborhood.service: DEBUG