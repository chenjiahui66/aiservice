# ============================================================
# 生产环境配置
# 所有敏感项必须由环境变量注入；缺失时应启动失败，而不是回落到默认值
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ⚠️ 这里刻意**不**开启 TLS 校验（sslMode=DISABLED），与 dev 保持一致。
    #
    # 踩过的坑：早先这里写的是 useSSL=true&requireSSL=true&verifyServerCertificate=true，
    # 生产启动直接失败 203 次：
    #     SSLHandshakeException: (certificate_unknown)
    #     Path does not chain with any of the trust anchors
    #
    # 原因：mysql:8.0 官方镜像自带的是**自签名 CA**，容器里 Temurin 的默认
    # truststore 不认它，JDBC 8 默认会协商 TLS 并校验证书链，握手必然失败。
    #
    # 为什么关掉是合理的：本部署形态下后端与数据库同机、同处 Docker 内部网络
    # （nb-net），流量不出宿主机网卡，本来就是隔离的。为自签 CA 单独维护一份
    # JVM truststore 并挂进容器，运维成本远大于收益。
    #
    # ⚠️ 如果将来把数据库拆到**独立主机**，必须改回 sslMode=VERIFY_IDENTITY，
    #    并把该主机的 CA 导入 JVM truststore（挂载 + -Djavax.net.ssl.trustStore）。
    #    那属于真正的跨网络连接，不能再按「内网即安全」处理。
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:neighborhood}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1200000
      pool-name: NeighborhoodHikari

  sql:
    init:
      # 生产环境**不自动执行**初始化脚本，schema 变更一律走 sql/ 下的人工审核迁移
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  jwt:
    provider-secret: ${JWT_PROVIDER_SECRET:?生产环境必须设置 JWT_PROVIDER_SECRET}
    admin-secret: ${JWT_ADMIN_SECRET:?生产环境必须设置 JWT_ADMIN_SECRET}
  wechat:
    app-id: ${WX_APP_ID:?生产环境必须设置 WX_APP_ID}
    app-secret: ${WX_APP_SECRET:?生产环境必须设置 WX_APP_SECRET}
    code-mode: REAL
  # 首次部署时置 BOOTSTRAP_ADMIN_ENABLED=true，应用会按 ADMIN_USERNAME/ADMIN_PASSWORD
  # 创建管理员；账号已存在时是**幂等空操作**，不会覆盖既有密码。
  # 管理员建好后应把该变量改回 false。
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
  storage:
    qr-dir: ${QR_DIR:/data/qr}

logging:
  level:
    root: INFO
    com.neighborhood.service: INFO
  file:
    name: ${LOG_FILE:/data/logs/neighborhood-backend.log}